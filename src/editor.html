<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD ↔ HTML 编辑器</title>
  <meta name="description" content="Markdown ↔ HTML 双向转换编辑器，支持富文本编辑、导入导出 PDF/Word/HTML/MD/TXT。">
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- ===== 顶部导航 ===== -->
  <header class="topbar">
    <a href="./index.html" class="topbar-home">← 返回首页</a>
    <span class="topbar-title">📄 MD ↔ HTML 编辑器</span>
    <span class="topbar-info">所有数据仅在浏览器中处理</span>
  </header>

  <main id="app" class="page page-tool">

    <!-- ===== 工具栏 ===== -->
    <div class="mdhtml-toolbar">
      <div class="mdhtml-dropdown">
        <button id="btnImport" class="btn">📥 导入</button>
        <div id="importMenu" class="mdhtml-dropdown-menu hidden">
          <button class="menu-item" data-format="md">📝 Markdown (.md)</button>
          <button class="menu-item" data-format="html">🌐 HTML (.html)</button>
          <button class="menu-item" data-format="txt">📃 纯文本 (.txt)</button>
          <button class="menu-item" data-format="word">📘 Word (.docx)</button>
        </div>
      </div>

      <div class="mdhtml-dropdown">
        <button id="btnExport" class="btn">📤 导出</button>
        <div id="exportMenu" class="mdhtml-dropdown-menu hidden">
          <button class="menu-item" data-format="pdf">📄 PDF (.pdf)</button>
          <button class="menu-item" data-format="word">📘 Word (.docx)</button>
          <button class="menu-item" data-format="html">🌐 独立 HTML (.html)</button>
          <button class="menu-item" data-format="md">📝 Markdown (.md)</button>
          <button class="menu-item" data-format="txt">📃 纯文本 (.txt)</button>
        </div>
      </div>

      <button id="btnClear" class="btn btn-danger" title="清空所有内容">🗑️ 清空</button>

      <div class="mdhtml-dropdown">
        <button id="btnTemplate" class="btn" title="文档模板">📋 模板</button>
        <div id="templateMenu" class="mdhtml-dropdown-menu hidden">
          <button class="menu-item" data-template="blog">📝 技术博客</button>
          <button class="menu-item" data-template="product">🏷️ 产品介绍</button>
          <button class="menu-item" data-template="meeting">📅 会议纪要</button>
          <button class="menu-item" data-template="resume">👤 个人简历</button>
          <button class="menu-item" data-template="api">🔌 API 文档</button>
          <button class="menu-item" data-template="notes">📚 读书笔记</button>
        </div>
      </div>
    </div>

    <!-- ===== 编辑区域 ===== -->
    <div class="mdhtml-editor">

      <!-- 左侧：Markdown -->
      <section class="mdhtml-pane">
        <div class="mdhtml-pane-header">
          <span>📝 Markdown</span>
          <div class="mdhtml-mode-btns">
            <button class="mdhtml-mode-btn active" data-pane="md" data-mode="render">阅读</button>
            <button class="mdhtml-mode-btn" data-pane="md" data-mode="source">源码</button>
          </div>
        </div>

        <div id="mdToolbar" class="mdhtml-fmt-bar">
          <button class="mdhtml-fmt-btn" data-fmt="bold" title="加粗 Ctrl+B"><b>B</b></button>
          <button class="mdhtml-fmt-btn" data-fmt="italic" title="斜体 Ctrl+I"><i>I</i></button>
          <button class="mdhtml-fmt-btn" data-fmt="underline" title="下划线"><u>U</u></button>
          <button class="mdhtml-fmt-btn" data-fmt="strike" title="删除线"><s>S</s></button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="h1" title="一级标题">H1</button>
          <button class="mdhtml-fmt-btn" data-fmt="h2" title="二级标题">H2</button>
          <button class="mdhtml-fmt-btn" data-fmt="h3" title="三级标题">H3</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="ul" title="无序列表">•</button>
          <button class="mdhtml-fmt-btn" data-fmt="ol" title="有序列表">1.</button>
          <button class="mdhtml-fmt-btn" data-fmt="checklist" title="任务列表">☐</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="blockquote" title="引用">❝</button>
          <button class="mdhtml-fmt-btn" data-fmt="link" title="插入链接">🔗</button>
          <button class="mdhtml-fmt-btn" data-fmt="hr" title="分割线">—</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="insertImage" title="插入图片">🖼️</button>
          <button class="mdhtml-fmt-btn" data-fmt="insertVideo" title="插入视频">🎬</button>
          <button class="mdhtml-fmt-btn" data-fmt="insertTable" title="插入表格">📊</button>
          <button class="mdhtml-fmt-btn" data-fmt="insertCodeBlock" title="代码块">💻</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="undo" title="撤销">↩</button>
          <button class="mdhtml-fmt-btn" data-fmt="redo" title="重做">↪</button>
          <label class="mdhtml-fmt-btn" title="上传图片/文件" style="cursor:pointer;">
            📂
            <input type="file" id="imageInputMd" accept="image/*,.mp4,.webm,.ogg,.md,.txt,.html" multiple hidden />
          </label>
        </div>

        <div id="mdRenderPane" class="mdhtml-render" contenteditable="true" spellcheck="false"
          data-placeholder="在左侧输入 Markdown，或粘贴图片 / 拖入文件…"></div>

        <textarea id="mdSourcePane" class="mdhtml-source hidden" spellcheck="false"
          placeholder="输入 Markdown 源码…&#10;&#10;支持 Ctrl+V 粘贴图片 / 拖入文件"></textarea>
      </section>

      <!-- 中间：互转按钮 -->
      <div class="mdhtml-center">
        <button id="btnSyncMdToHtml" class="mdhtml-sync-btn" title="Markdown → HTML">
          <span class="mdhtml-sync-arrow">→</span>
          <span class="mdhtml-sync-label">转 HTML</span>
        </button>
        <div class="mdhtml-sync-divider"></div>
        <button id="btnSyncHtmlToMd" class="mdhtml-sync-btn" title="HTML → Markdown">
          <span class="mdhtml-sync-arrow">←</span>
          <span class="mdhtml-sync-label">转 MD</span>
        </button>
      </div>

      <!-- 右侧：HTML -->
      <section class="mdhtml-pane">
        <div class="mdhtml-pane-header">
          <span>🌐 HTML</span>
          <div class="mdhtml-mode-btns">
            <button class="mdhtml-mode-btn active" data-pane="html" data-mode="render">阅读</button>
            <button class="mdhtml-mode-btn" data-pane="html" data-mode="source">源码</button>
          </div>
        </div>

        <div id="htmlToolbar" class="mdhtml-fmt-bar hidden">
          <button class="mdhtml-fmt-btn" data-fmt="bold" title="加粗"><b>B</b></button>
          <button class="mdhtml-fmt-btn" data-fmt="italic" title="斜体"><i>I</i></button>
          <button class="mdhtml-fmt-btn" data-fmt="underline" title="下划线"><u>U</u></button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="h1" title="一级标题">H1</button>
          <button class="mdhtml-fmt-btn" data-fmt="h2" title="二级标题">H2</button>
          <button class="mdhtml-fmt-btn" data-fmt="h3" title="三级标题">H3</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="ul" title="无序列表">•</button>
          <button class="mdhtml-fmt-btn" data-fmt="ol" title="有序列表">1.</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="blockquote" title="引用">❝</button>
          <button class="mdhtml-fmt-btn" data-fmt="link" title="插入链接">🔗</button>
          <button class="mdhtml-fmt-btn" data-fmt="hr" title="分割线">—</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="insertImage" title="插入图片">🖼️</button>
          <button class="mdhtml-fmt-btn" data-fmt="insertVideo" title="插入视频">🎬</button>
          <button class="mdhtml-fmt-btn" data-fmt="insertTable" title="插入表格">📊</button>
          <button class="mdhtml-fmt-btn" data-fmt="codeInline" title="行内代码">&lt;/&gt;</button>
          <span class="mdhtml-fmt-sep"></span>
          <button class="mdhtml-fmt-btn" data-fmt="undo" title="撤销">↩</button>
          <button class="mdhtml-fmt-btn" data-fmt="redo" title="重做">↪</button>
          <label class="mdhtml-fmt-btn" title="上传图片" style="cursor:pointer;">
            📂
            <input type="file" id="imageInputHtml" accept="image/*,.mp4,.webm,.ogg,.html" multiple hidden />
          </label>
        </div>

        <div id="htmlRenderPane" class="mdhtml-render" contenteditable="true" spellcheck="false"
          data-placeholder="右侧显示 HTML 渲染结果…"></div>

        <textarea id="htmlSourcePane" class="mdhtml-source hidden" spellcheck="false"
          placeholder="输入或粘贴 HTML 源码…&#10;&#10;支持 Ctrl+V 粘贴图片 / 拖入文件"></textarea>
      </section>

    </div>

    <!-- ===== 弹窗 ===== -->
    <div class="mdhtml-modal-overlay hidden" id="videoModal">
      <div class="mdhtml-modal">
        <h3>🎬 插入视频</h3>
        <p class="modal-desc">支持 B站 / YouTube / 通用 iframe URL</p>
        <input type="text" id="videoUrl" class="modal-input" placeholder="https://b23.tv/xxx 或 https://www.youtube.com/watch?v=xxx" />
        <div class="mdhtml-modal-btns">
          <button class="btn btn-primary" id="btnConfirmVideo">插入</button>
          <button class="btn btn-secondary" id="btnCancelVideo">取消</button>
        </div>
      </div>
    </div>

    <div class="mdhtml-modal-overlay hidden" id="tableModal">
      <div class="mdhtml-modal">
        <h3>📊 插入表格</h3>
        <div class="modal-row"><label>行数：</label><input type="number" id="tableRows" value="3" min="2" max="20" /></div>
        <div class="modal-row"><label>列数：</label><input type="number" id="tableCols" value="3" min="1" max="10" /></div>
        <div class="mdhtml-modal-btns">
          <button class="btn btn-primary" id="btnConfirmTable">插入</button>
          <button class="btn btn-secondary" id="btnCancelTable">取消</button>
        </div>
      </div>
    </div>

    <div class="mdhtml-modal-overlay hidden" id="codeBlockModal">
      <div class="mdhtml-modal">
        <h3>💻 插入代码块</h3>
        <input type="text" id="codeLang" class="modal-input" placeholder="语言（如 js / python / css）" />
        <textarea id="codeContent" class="modal-textarea" placeholder="输入代码…"></textarea>
        <div class="mdhtml-modal-btns">
          <button class="btn btn-primary" id="btnConfirmCodeBlock">插入</button>
          <button class="btn btn-secondary" id="btnCancelCodeBlock">取消</button>
        </div>
      </div>
    </div>

    <div class="mdhtml-modal-overlay hidden" id="linkModal">
      <div class="mdhtml-modal">
        <h3>🔗 插入链接</h3>
        <input type="text" id="linkText" class="modal-input" placeholder="链接文字" />
        <input type="text" id="linkUrl" class="modal-input" placeholder="https://…" />
        <div class="mdhtml-modal-btns">
          <button class="btn btn-primary" id="btnConfirmLink">插入</button>
          <button class="btn btn-secondary" id="btnCancelLink">取消</button>
        </div>
      </div>
    </div>

    <div class="mdhtml-modal-overlay hidden" id="imageModal">
      <div class="mdhtml-modal">
        <h3>🖼️ 插入图片</h3>
        <input type="file" id="imgFileInput" accept="image/*" class="modal-input" style="padding:4px;" />
        <div class="mdhtml-modal-btns">
          <button class="btn btn-primary" id="btnConfirmImage">插入</button>
          <button class="btn btn-secondary" id="btnCancelImage">取消</button>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="./editor.js"></script>
</body>
</html>
