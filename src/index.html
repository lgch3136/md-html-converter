<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD ↔ HTML 编辑器</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="toolbar">
    <h1 class="logo">📄 MD ↔ HTML</h1>
    <div class="tool-group">
      <!-- 导入按钮 + 下拉菜单 -->
      <div class="dropdown">
        <button id="btnImport" class="btn btn-secondary" title="导入文件">📥 导入</button>
        <div id="importMenu" class="dropdown-menu hidden">
          <button class="menu-item" data-format="md">📝 Markdown (.md)</button>
          <button class="menu-item" data-format="html">🌐 HTML (.html)</button>
          <button class="menu-item" data-format="txt">📃 纯文本 (.txt)</button>
          <button class="menu-item" data-format="word">📘 Word (.docx)</button>
        </div>
      </div>
      <!-- 隐藏的文件 input -->
      <input type="file" id="importInput" hidden />

      <!-- 导出按钮 + 下拉菜单 -->
      <div class="dropdown">
        <button id="btnExport" class="btn btn-success" title="导出文件">📤 导出</button>
        <div id="exportMenu" class="dropdown-menu hidden">
          <button class="menu-item" data-format="pdf">📄 PDF (.pdf)</button>
          <button class="menu-item" data-format="word">📘 Word (.docx)</button>
          <button class="menu-item" data-format="html">🌐 独立 HTML (.html)</button>
          <button class="menu-item" data-format="md">📝 Markdown (.md)</button>
          <button class="menu-item" data-format="txt">📃 纯文本 (.txt)</button>
        </div>
      </div>

      <span class="sep"></span>
      <button id="btnClear" class="btn btn-danger" title="清空所有内容">🗑️ 清空</button>
    </div>
    <div class="file-info" id="fileInfo">就绪</div>
  </header>

  <main class="editor-area">

    <!-- ===== 左侧：Markdown ===== -->
    <section class="pane pane-left">
      <div class="pane-header">
        <span>📝 Markdown</span>
        <div class="pane-mode-btns">
          <button class="pane-mode-btn active" data-pane="md" data-mode="render">阅读</button>
          <button class="pane-mode-btn" data-pane="md" data-mode="source">源码</button>
        </div>
      </div>

      <!-- MD 工具栏 -->
      <div class="format-toolbar" id="mdToolbar">
        <button class="fmt-btn" data-fmt="bold" title="加粗 Ctrl+B"><b>B</b></button>
        <button class="fmt-btn" data-fmt="italic" title="斜体 Ctrl+I"><i>I</i></button>
        <button class="fmt-btn" data-fmt="underline" title="下划线"><u>U</u></button>
        <button class="fmt-btn" data-fmt="strike" title="删除线"><s>S</s></button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="h1" title="一级标题">H1</button>
        <button class="fmt-btn" data-fmt="h2" title="二级标题">H2</button>
        <button class="fmt-btn" data-fmt="h3" title="三级标题">H3</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="ul" title="无序列表">•</button>
        <button class="fmt-btn" data-fmt="ol" title="有序列表">1.</button>
        <button class="fmt-btn" data-fmt="checklist" title="任务列表">☐</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="blockquote" title="引用">❝</button>
        <button class="fmt-btn" data-fmt="link" title="链接">🔗</button>
        <button class="fmt-btn" data-fmt="hr" title="分割线">—</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="insertImage" title="插入图片">🖼️</button>
        <button class="fmt-btn" data-fmt="insertVideo" title="插入视频">🎬</button>
        <button class="fmt-btn" data-fmt="insertTable" title="插入表格">📊</button>
        <button class="fmt-btn" data-fmt="insertCodeBlock" title="代码块">💻</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="undo" title="撤销">↩</button>
        <button class="fmt-btn" data-fmt="redo" title="重做">↪</button>
        <label class="fmt-btn" title="上传图片/文件" style="cursor:pointer;">📂
          <input type="file" id="imageInputMd" accept="image/*,.mp4,.webm,.ogg,.md,.txt,.html" multiple hidden />
        </label>
      </div>

      <!-- MD 阅读模式 -->
      <div id="mdRenderPane" class="render-pane" contenteditable="true" spellcheck="false"
        data-placeholder="在左侧输入 Markdown，或粘贴图片 / 拖入文件…"></div>

      <!-- MD 源码模式 -->
      <textarea id="mdSourcePane" class="source-pane hidden" spellcheck="false"
        placeholder="输入 Markdown 源码…&#10;&#10;支持 Ctrl+V 粘贴图片 / 拖入文件"></textarea>
    </section>

    <!-- ===== 中间：互转按钮 ===== -->
    <div class="center-bar">
      <button id="btnSyncMdToHtml" class="sync-btn" title="Markdown → HTML">
        <span class="sync-arrow">→</span>
        <span class="sync-label">转 HTML</span>
      </button>
      <div class="sync-divider"></div>
      <button id="btnSyncHtmlToMd" class="sync-btn" title="HTML → Markdown">
        <span class="sync-arrow">←</span>
        <span class="sync-label">转 MD</span>
      </button>
    </div>

    <!-- ===== 右侧：HTML ===== -->
    <section class="pane pane-right">
      <div class="pane-header">
        <span>🌐 HTML</span>
        <div class="pane-mode-btns">
          <button class="pane-mode-btn active" data-pane="html" data-mode="render">阅读</button>
          <button class="pane-mode-btn" data-pane="html" data-mode="source">源码</button>
        </div>
      </div>

      <!-- HTML 工具栏 -->
      <div class="format-toolbar hidden" id="htmlToolbar">
        <button class="fmt-btn" data-fmt="bold" title="加粗"><b>B</b></button>
        <button class="fmt-btn" data-fmt="italic" title="斜体"><i>I</i></button>
        <button class="fmt-btn" data-fmt="underline" title="下划线"><u>U</u></button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="h1" title="一级标题">H1</button>
        <button class="fmt-btn" data-fmt="h2" title="二级标题">H2</button>
        <button class="fmt-btn" data-fmt="h3" title="三级标题">H3</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="ul" title="无序列表">•</button>
        <button class="fmt-btn" data-fmt="ol" title="有序列表">1.</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="blockquote" title="引用">❝</button>
        <button class="fmt-btn" data-fmt="link" title="链接">🔗</button>
        <button class="fmt-btn" data-fmt="hr" title="分割线">—</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="insertImage" title="插入图片">🖼️</button>
        <button class="fmt-btn" data-fmt="insertVideo" title="插入视频">🎬</button>
        <button class="fmt-btn" data-fmt="insertTable" title="插入表格">📊</button>
        <button class="fmt-btn" data-fmt="codeInline" title="行内代码">&lt;/&gt;</button>
        <span class="fmt-sep"></span>
        <button class="fmt-btn" data-fmt="undo" title="撤销">↩</button>
        <button class="fmt-btn" data-fmt="redo" title="重做">↪</button>
        <label class="fmt-btn" title="上传图片" style="cursor:pointer;">📂
          <input type="file" id="imageInputHtml" accept="image/*,.mp4,.webm,.ogg,.html" multiple hidden />
        </label>
      </div>

      <!-- HTML 阅读模式 -->
      <div id="htmlRenderPane" class="render-pane" contenteditable="true" spellcheck="false"
        data-placeholder="右侧显示 HTML 渲染结果…"></div>

      <!-- HTML 源码模式 -->
      <textarea id="htmlSourcePane" class="source-pane hidden" spellcheck="false"
        placeholder="输入或粘贴 HTML 源码…&#10;&#10;支持 Ctrl+V 粘贴图片 / 拖入文件"></textarea>
    </section>

  </main>

  <!-- ===== 弹窗 ===== -->
  <!-- 插入视频 -->
  <div class="modal-overlay hidden" id="videoModal">
    <div class="modal">
      <h3>🎬 插入视频</h3>
      <p class="modal-desc">支持 B站 / YouTube / 通用 iframe URL</p>
      <input type="text" id="videoUrl" class="modal-input" placeholder="https://b23.tv/xxx 或 https://www.youtube.com/watch?v=xxx" />
      <div class="modal-buttons">
        <button class="btn btn-primary" id="btnConfirmVideo">插入</button>
        <button class="btn btn-secondary" id="btnCancelVideo">取消</button>
      </div>
    </div>
  </div>

  <!-- 插入表格 -->
  <div class="modal-overlay hidden" id="tableModal">
    <div class="modal">
      <h3>📊 插入表格</h3>
      <div class="modal-row"><label>行数：</label><input type="number" id="tableRows" value="3" min="2" max="20" /></div>
      <div class="modal-row"><label>列数：</label><input type="number" id="tableCols" value="3" min="1" max="10" /></div>
      <div class="modal-buttons">
        <button class="btn btn-primary" id="btnConfirmTable">插入</button>
        <button class="btn btn-secondary" id="btnCancelTable">取消</button>
      </div>
    </div>
  </div>

  <!-- 插入代码块 -->
  <div class="modal-overlay hidden" id="codeBlockModal">
    <div class="modal">
      <h3>💻 插入代码块</h3>
      <input type="text" id="codeLang" class="modal-input" placeholder="语言（如 js / python / css）" />
      <textarea id="codeContent" class="modal-textarea" placeholder="输入代码…"></textarea>
      <div class="modal-buttons">
        <button class="btn btn-primary" id="btnConfirmCodeBlock">插入</button>
        <button class="btn btn-secondary" id="btnCancelCodeBlock">取消</button>
      </div>
    </div>
  </div>

  <!-- 插入链接 -->
  <div class="modal-overlay hidden" id="linkModal">
    <div class="modal">
      <h3>🔗 插入链接</h3>
      <input type="text" id="linkText" class="modal-input" placeholder="链接文字" />
      <input type="text" id="linkUrl" class="modal-input" placeholder="https://…" />
      <div class="modal-buttons">
        <button class="btn btn-primary" id="btnConfirmLink">插入</button>
        <button class="btn btn-secondary" id="btnCancelLink">取消</button>
      </div>
    </div>
  </div>

  <!-- 插入图片 -->
  <div class="modal-overlay hidden" id="imageModal">
    <div class="modal">
      <h3>🖼️ 插入图片</h3>
      <input type="file" id="imgFileInput" accept="image/*" class="modal-input" style="padding:4px;" />
      <div class="modal-buttons">
        <button class="btn btn-primary" id="btnConfirmImage">插入</button>
        <button class="btn btn-secondary" id="btnCancelImage">取消</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
